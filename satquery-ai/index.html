<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Satellite imagery diagnostics with explicit evidence, limitations and provenance." />
    <meta name="keywords" content="satellite imagery, remote sensing, AI agent, change detection, SAR, optical, cloud reconstruction" />
    <title>SatQuery AI | Earth Observation Workspace</title>
    <script>
      try {
        const saved = localStorage.getItem('satquery_theme');
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
